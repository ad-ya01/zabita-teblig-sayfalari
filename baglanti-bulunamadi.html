<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onikişubat Belediyesi Zabıta Müdürlüğü - Bağlantı Bulunamadı</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.kart {
  background: white;
  max-width: 480px;
  width: 100%;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
}
.header {
  background: #E30613;
  color: white;
  padding: 28px 24px;
  text-align: center;
  border-bottom: 3px solid #C0922C;
}
.header h1 { font-size: 18px; font-weight: 700; margin-bottom: 6px; letter-spacing: 0.5px; }
.header p { font-size: 13px; opacity: 0.95; font-weight: 500; }
.icon { font-size: 64px; margin: 28px auto 4px; text-align: center; }
.content { padding: 8px 28px 32px; text-align: center; }
.content h2 { font-size: 22px; color: #1A1A1A; margin-bottom: 14px; font-weight: 700; }
.content p { font-size: 14px; color: #555; line-height: 1.65; margin-bottom: 12px; }
.uyari-notu {
  background: #FFF8F8;
  border-left: 3px solid #E30613;
  padding: 12px 14px;
  margin-top: 18px;
  border-radius: 4px;
  text-align: left;
}
.uyari-notu p { font-size: 12px; color: #666; margin: 0; line-height: 1.5; }
.footer {
  background: #1A1A1A;
  color: #C0922C;
  padding: 14px;
  text-align: center;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.3px;
}
</style>
</head>
<body>
<div class="kart">
<div class="header">
<h1>ONİKİŞUBAT BELEDİYESİ</h1>
<p>Zabıta Müdürlüğü</p>
</div>
<div class="icon">🔍</div>
<div class="content">
<h2>Bağlantı Bulunamadı</h2>
<p>Bu tebliğ bağlantısı sistemde bulunamadı.</p>
<p>Bağlantı geçersiz olabilir veya kaldırılmış olabilir.</p>
<div class="uyari-notu">
<p><strong>Bilgi:</strong> Sorunun devam etmesi halinde Zabıta Müdürlüğü ile iletişime geçiniz.</p>
</div>
</div>
<div class="footer">
Onikişubat Belediyesi Zabıta Müdürlüğü © 2026
</div>
</div>
</body>
</html>
